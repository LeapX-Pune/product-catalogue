<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Catalogue</title>

    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/catalog.css">
</head>
<body>

    <div class="catalog-container">

        <div class="search-section">

            <label
    for="searchInput"
    class="sr-only"
>
    Search Products
</label>

<input
    type="text"
    id="searchInput"
    placeholder="Search products..."
    aria-label="Search Products"
    autocomplete="off"
>

            <div
    id="searchHistory"
    aria-live="polite"
></div>

<button
    id="clearHistoryBtn"
    aria-label="Clear Search History"
>
    Clear History
</button>

<div
    id="loadingState"
    class="hidden"
    aria-live="assertive"
>
    Loading...
</div>

        </div>

        <div
            id="productGrid"
            class="product-grid"
        ></div>

        <div
            id="noResults"
            class="no-results hidden"
        >
            No products found
        </div>

    </div>

    <script
        type="module"
        src="./js/script.js"
    ></script>

</body>
</html>
